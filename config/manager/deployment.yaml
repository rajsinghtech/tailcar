apiVersion: v1
kind: Namespace
metadata:
  name: tailcar-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailcar-controller-manager
  namespace: tailcar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tailcar-controller-manager
rules:
- apiGroups: [""]
  resources: ["pods", "pods/status"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["tailcar.rajsingh.info"]
  resources: ["tailnets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["tailcar.rajsingh.info"]
  resources: ["tailnets/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["tailcar.rajsingh.info"]
  resources: ["tailnets/finalizers"]
  verbs: ["update"]
- apiGroups: ["tailcar.rajsingh.info"]
  resources: ["tailserves"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["tailcar.rajsingh.info"]
  resources: ["tailserves/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["tailcar.rajsingh.info"]
  resources: ["tailserves/finalizers"]
  verbs: ["update"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailcar-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tailcar-controller-manager
subjects:
- kind: ServiceAccount
  name: tailcar-controller-manager
  namespace: tailcar-system
---
apiVersion: v1
kind: Service
metadata:
  name: tailcar-webhook
  namespace: tailcar-system
spec:
  ports:
  - name: webhook
    port: 443
    targetPort: 9443
  selector:
    app: tailcar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailcar-controller-manager
  namespace: tailcar-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailcar
  template:
    metadata:
      labels:
        app: tailcar
    spec:
      serviceAccountName: tailcar-controller-manager
      initContainers:
      - name: cert-generator
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e
          apk add --no-cache openssl kubectl

          SERVICE_NAME="tailcar-webhook"
          NAMESPACE="tailcar-system"
          SECRET_NAME="tailcar-webhook-tls"
          WEBHOOK_NAME="tailcar-webhook"

          if kubectl get secret ${SECRET_NAME} -n ${NAMESPACE} &>/dev/null; then
            echo "Certificates exist, skipping"
            exit 0
          fi

          CERT_DIR=$(mktemp -d)
          cd $CERT_DIR

          openssl genrsa -out ca.key 2048
          openssl req -x509 -new -nodes -key ca.key -sha256 -days 3650 -out ca.crt -subj "/CN=${SERVICE_NAME} CA"
          openssl genrsa -out tls.key 2048
          openssl req -new -key tls.key -out server.csr -subj "/CN=${SERVICE_NAME}.${NAMESPACE}.svc"

          cat > server.ext <<EOF
          subjectAltName = DNS:${SERVICE_NAME}.${NAMESPACE}.svc,DNS:${SERVICE_NAME}.${NAMESPACE}.svc.cluster.local
          EOF

          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out tls.crt -days 3650 -sha256 -extfile server.ext

          kubectl create secret generic ${SECRET_NAME} --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key --from-file=ca.crt=ca.crt --namespace=${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          CA_BUNDLE=$(cat ca.crt | base64 | tr -d '\n')

          for i in $(seq 1 30); do
            if kubectl get mutatingwebhookconfiguration ${WEBHOOK_NAME} &>/dev/null; then
              break
            fi
            sleep 2
          done

          kubectl patch mutatingwebhookconfiguration ${WEBHOOK_NAME} --type='json' -p='[{"op": "add", "path": "/webhooks/0/clientConfig/caBundle", "value":"'"${CA_BUNDLE}"'"}]' || kubectl patch mutatingwebhookconfiguration ${WEBHOOK_NAME} --type='json' -p='[{"op": "replace", "path": "/webhooks/0/clientConfig/caBundle", "value":"'"${CA_BUNDLE}"'"}]'

          rm -rf $CERT_DIR
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      containers:
      - name: manager
        image: ghcr.io/rajsinghtech/tailcar:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: webhook-tls
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: healthz
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      volumes:
      - name: webhook-tls
        secret:
          secretName: tailcar-webhook-tls
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: tailcar-webhook
webhooks:
- name: pod.tailcar.rajsingh.info
  clientConfig:
    service:
      name: tailcar-webhook
      namespace: tailcar-system
      path: /mutate-v1-pod
  failurePolicy: Fail
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    operations: ["CREATE"]
  namespaceSelector:
    matchLabels:
      tailcar.rajsingh.info/injection: enabled