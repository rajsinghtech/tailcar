apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: tailcar-webhook
webhooks:
- name: tailcar.rajsingh.info
  clientConfig:
    service:
      name: tailcar-webhook
      namespace: tailcar-system
      path: /mutate-v1-pod
      port: 443
  failurePolicy: Ignore
  reinvocationPolicy: Never
  timeoutSeconds: 10
  sideEffects: None
  admissionReviewVersions: ["v1"]
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "*"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: ["kube-system", "kube-public", "kube-node-lease", "tailcar-system"]
