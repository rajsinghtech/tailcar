{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "tailcar.fullname" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailcar.labels" . | nindent 4 }}
spec:
  dnsNames:
  - {{ include "tailcar.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
  - {{ include "tailcar.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "tailcar.fullname" . }}-selfsigned-issuer
  secretName: {{ include "tailcar.webhookCertSecretName" . }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "tailcar.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailcar.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
