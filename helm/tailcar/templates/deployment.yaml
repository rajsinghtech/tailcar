apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailcar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailcar.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tailcar.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tailcar.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tailcar.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      restartPolicy: {{ .Values.restartPolicy }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.webhook.enabled }}
      initContainers:
      - name: cert-generator
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e

          echo "Installing dependencies..."
          apk add --no-cache openssl curl ca-certificates

          # Install kubectl - detect architecture
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) KUBECTL_ARCH="amd64" ;;
            aarch64) KUBECTL_ARCH="arm64" ;;
            armv7l) KUBECTL_ARCH="arm" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac

          echo "Downloading kubectl for $KUBECTL_ARCH..."
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/${KUBECTL_ARCH}/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/

          echo "Generating webhook certificates..."

          SERVICE_NAME="{{ include "tailcar.webhookServiceName" . }}"
          NAMESPACE="{{ .Release.Namespace }}"
          SECRET_NAME="{{ include "tailcar.webhookCertSecretName" . }}"
          WEBHOOK_NAME="{{ include "tailcar.fullname" . }}-webhook"

          # Check if certificates already exist
          if kubectl get secret ${SECRET_NAME} -n ${NAMESPACE} &>/dev/null; then
            if kubectl get secret ${SECRET_NAME} -n ${NAMESPACE} -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -checkend 2592000 &>/dev/null; then
              echo "Valid certificates already exist, skipping generation"
              exit 0
            fi
            echo "Certificates expired or invalid, regenerating..."
          fi

          # Create temporary directory
          CERT_DIR=$(mktemp -d)
          cd $CERT_DIR

          # Generate CA key and certificate
          openssl genrsa -out ca.key 2048
          openssl req -x509 -new -nodes -key ca.key -sha256 -days 3650 -out ca.crt \
            -subj "/CN=${SERVICE_NAME} CA"

          # Generate server key and CSR
          openssl genrsa -out tls.key 2048
          openssl req -new -key tls.key -out server.csr \
            -subj "/CN=${SERVICE_NAME}.${NAMESPACE}.svc"

          # Create extensions file for SANs
          cat > server.ext <<EOF
          subjectAltName = DNS:${SERVICE_NAME}.${NAMESPACE}.svc,DNS:${SERVICE_NAME}.${NAMESPACE}.svc.cluster.local
          EOF

          # Sign server certificate with CA
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out tls.crt -days 3650 -sha256 -extfile server.ext

          # Create or update secret
          echo "Creating/updating secret ${SECRET_NAME}..."
          kubectl create secret generic ${SECRET_NAME} \
            --from-file=tls.crt=tls.crt \
            --from-file=tls.key=tls.key \
            --from-file=ca.crt=ca.crt \
            --namespace=${NAMESPACE} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Update webhook configurations with CA bundle
          echo "Updating webhook configurations with CA bundle..."
          CA_BUNDLE=$(cat ca.crt | base64 | tr -d '\n')

          # Wait for webhook configs to exist
          for i in $(seq 1 30); do
            if kubectl get mutatingwebhookconfiguration ${WEBHOOK_NAME} &>/dev/null; then
              break
            fi
            echo "Waiting for MutatingWebhookConfiguration to be created... ($i/30)"
            sleep 2
          done

          # Patch mutating webhook
          kubectl patch mutatingwebhookconfiguration ${WEBHOOK_NAME} \
            --type='json' \
            -p='[{"op": "add", "path": "/webhooks/0/clientConfig/caBundle", "value":"'"${CA_BUNDLE}"'"}]' || \
          kubectl patch mutatingwebhookconfiguration ${WEBHOOK_NAME} \
            --type='json' \
            -p='[{"op": "replace", "path": "/webhooks/0/clientConfig/caBundle", "value":"'"${CA_BUNDLE}"'"}]'

          # Patch validating webhook
          VALIDATOR_NAME="{{ include "tailcar.fullname" . }}-validator"
          if kubectl get validatingwebhookconfiguration ${VALIDATOR_NAME} &>/dev/null; then
            echo "Updating ValidatingWebhookConfiguration with CA bundle..."
            kubectl patch validatingwebhookconfiguration ${VALIDATOR_NAME} \
              --type='json' \
              -p='[{"op": "add", "path": "/webhooks/0/clientConfig/caBundle", "value":"'"${CA_BUNDLE}"'"}]' || \
            kubectl patch validatingwebhookconfiguration ${VALIDATOR_NAME} \
              --type='json' \
              -p='[{"op": "replace", "path": "/webhooks/0/clientConfig/caBundle", "value":"'"${CA_BUNDLE}"'"}]'
          fi

          echo "Webhook certificates generated and configured successfully!"

          # Cleanup
          cd /
          rm -rf $CERT_DIR
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      {{- end }}
      containers:
      - name: manager
        image: {{ include "tailcar.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect={{ .Values.leaderElection.enabled }}
        {{- if .Values.webhook.enabled }}
        - --webhook-port={{ .Values.webhook.port }}
        {{- else }}
        - --webhook-port=0
        {{- end }}
        - --health-probe-bind-address=:{{ .Values.health.port }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        env:
        - name: WATCH_NAMESPACE
          value: {{ include "tailcar.watchNamespace" . | quote }}
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        {{- if .Values.webhook.enabled }}
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        - containerPort: {{ .Values.health.port }}
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        {{- if .Values.webhook.enabled }}
        - name: cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
        - name: tmp
          mountPath: /tmp
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      {{- if .Values.webhook.enabled }}
      - name: cert
        secret:
          secretName: {{ include "tailcar.webhookCertSecretName" . }}
          defaultMode: 420
          optional: true
      {{- end }}
      - name: tmp
        emptyDir: {}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
