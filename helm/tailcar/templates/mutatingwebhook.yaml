{{- if .Values.webhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "tailcar.fullname" . }}-webhook
  labels:
    {{- include "tailcar.labels" . | nindent 4 }}
    tailcar.rajsingh.info/inject-ca: "true"
webhooks:
- name: mpod.tailcar.rajsingh.info
  clientConfig:
    service:
      name: {{ include "tailcar.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-v1-pod
      port: {{ .Values.webhook.service.port }}
  failurePolicy: Ignore
  reinvocationPolicy: Never
  timeoutSeconds: 10
  sideEffects: None
  admissionReviewVersions: ["v1"]
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "*"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: ["kube-system", "kube-public", "kube-node-lease"]
    {{- if .Values.webhook.namespaceSelector.requireLabel }}
    - key: tailcar.rajsingh.info/injection
      operator: In
      values: ["enabled"]
    {{- end }}
{{- end }}
