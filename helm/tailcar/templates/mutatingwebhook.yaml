{{- if .Values.webhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "tailcar.fullname" . }}-webhook
  labels:
    {{- include "tailcar.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "tailcar.fullname" . }}-serving-cert
  {{- end }}
webhooks:
- name: tailcar.rajsingh.info
  clientConfig:
    service:
      name: {{ include "tailcar.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-v1-pod
      port: {{ .Values.webhook.service.port }}
  failurePolicy: Ignore
  reinvocationPolicy: Never
  timeoutSeconds: 10
  sideEffects: None
  admissionReviewVersions: ["v1"]
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "*"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: ["kube-system", "kube-public", "kube-node-lease", "{{ .Release.Namespace }}"]
{{- end }}
