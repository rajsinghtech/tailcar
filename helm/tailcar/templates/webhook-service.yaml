{{- if .Values.webhook.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tailcar.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailcar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webhook.service.type }}
  ports:
  - name: webhook
    port: {{ .Values.webhook.service.port }}
    targetPort: webhook-server
    protocol: TCP
  selector:
    {{- include "tailcar.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
